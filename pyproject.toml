[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veritrag"
version = "0.1.0"
description = "Evidence-first reliability gateway for RAG and LLM applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Praveena Satti"}]
keywords = ["rag", "llm", "ai-safety", "retrieval", "observability", "provenance"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "numpy>=2,<3",
  "scikit-learn>=1.5,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
semantic = ["sentence-transformers>=3,<6"]

[project.scripts]
veritrag = "veritrag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/veritrag"]

[tool.pytest.ini_options]
addopts = "-q --cov=veritrag --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
packages = ["veritrag"]
